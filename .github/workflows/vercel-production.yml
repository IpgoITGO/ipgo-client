name: Vercel 운영 배포

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.stage.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검증
        run: npm run ci:check

      - name: Vercel CLI 설치
        run: npm install --global "vercel@${VERCEL_CLI_VERSION:?VERCEL_CLI_VERSION가 필요합니다}"

      - name: Production 환경 가져오기
        run: vercel pull --yes --environment=production

      - name: Production build
        run: vercel build --prod

      - id: stage
        name: 운영 후보 배포
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes | tail -n 1)"
          DEPLOYMENT_URL="$deployment_url" node scripts/automation/validate-vercel-url.mjs
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: 운영 후보 확인
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: node scripts/automation/smoke-test.mjs

      - name: 운영 승격
        run: vercel promote "${{ steps.stage.outputs.url }}" --yes

      - name: Jira와 GitHub Issue 완료 처리
        if: success()
        run: node scripts/automation/jira-github-sync.mjs complete
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SYNC_TEXT: ${{ github.event.head_commit.message }}
