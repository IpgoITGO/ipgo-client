name: Jira GitHub 동기화

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  issues:
    types: [closed, reopened, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: jira-github-sync
  cancel-in-progress: false

jobs:
  poll-jira:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Jira 변경을 GitHub에 동기화
        run: node scripts/automation/jira-github-sync.mjs poll
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_SYNC_CREATED_AFTER: ${{ vars.JIRA_SYNC_CREATED_AFTER }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PROJECT_V2_NUMBER: ${{ vars.PROJECT_V2_NUMBER }}

  sync-github-event:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: GitHub 변경을 Jira에 동기화
        run: node scripts/automation/jira-github-sync.mjs event
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
