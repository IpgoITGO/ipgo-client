name: Vercel 개발 배포

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 승인받은 dev 전체 commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-development-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:check
      - run: npm run build

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 승인 SHA 확인
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/automation/validate-dev-deployment.mjs

      - name: Vercel CLI 설치
        run: npm install --global "vercel@${VERCEL_CLI_VERSION:?VERCEL_CLI_VERSION가 필요합니다}"

      - name: Preview 환경 가져오기
        run: vercel pull --yes --environment=preview

      - name: Preview build
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'vercel.json'
          const config = JSON.parse(fs.readFileSync(file, 'utf8'))
          config.buildCommand = 'VITE_ENABLE_MSW=false npm run build'
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n')
          NODE
          vercel build

      - id: deploy
        name: 개발 배포
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --yes | tail -n 1)"
          DEPLOYMENT_URL="$deployment_url" node scripts/automation/validate-vercel-url.mjs
          vercel alias set "$deployment_url" ipgo-client-dev.vercel.app
          vercel alias set "$deployment_url" ipgo-dev.iwhya.kr
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: 개발 주소 확인
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/automation/smoke-test.mjs
