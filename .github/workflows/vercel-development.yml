name: Vercel 개발 배포

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 승인받은 dev 전체 commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-development-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify successful CI for the exact approved source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/automation/verify-source-ci.mjs
      - name: Run npm ci
        run: npm ci --prefer-offline --no-fund
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev'
      - run: npm run ci:check
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev'
      - name: Build CI source outside a dev deployment
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dev'
        run: npm run build:ci

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      ALIAS_BACKUP_FILE: ${{ runner.temp }}/dev-alias-backup.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: 승인 SHA 확인
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/automation/validate-dev-deployment.mjs

      - name: Vercel CLI 버전 확인
        run: >-
          node --input-type=module -e
          'if (!/^\d+\.\d+\.\d+$/.test(process.env.VERCEL_CLI_VERSION ?? ""))
          throw new Error("VERCEL_CLI_VERSION은 검토한 정확한 버전이어야 합니다")'

      - name: Vercel CLI 다운로드 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vercel-npm-cache/_cacache
          key: vercel-npm-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-cli-${{ env.VERCEL_CLI_VERSION }}

      - name: Vercel CLI 설치
        run: npm install --global --no-fund --cache "$RUNNER_TEMP/vercel-npm-cache" "vercel@${VERCEL_CLI_VERSION:?VERCEL_CLI_VERSION가 필요합니다}"

      - name: Preview 환경 가져오기
        run: vercel pull --yes --environment=preview

      - name: Preview build
        run: |
          node scripts/automation/prepare-vercel-build.mjs preview
          vercel build

      - name: 개발 주소 자동 할당 검사·게시 전 백업
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/automation/preview-alias-preflight.mjs

      - id: deploy
        name: 개발 배포
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --yes | tail -n 1)"
          DEPLOYMENT_URL="$deployment_url" node scripts/automation/validate-vercel-url.mjs
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: 개발 후보 확인·주소 전환·후검증
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/automation/switch-dev-aliases.mjs
